name: Build Commander BLE Logger APK

on:
  push:
    branches:
      - commander-ble-logger
    paths:
      - 'commander-ble-logger/**'
      - '.github/workflows/build-commander-ble-logger.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: commander-ble-logger
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Commander-BLE-Logger-debug-apk
          path: commander-ble-logger/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
