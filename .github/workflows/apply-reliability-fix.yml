name: Apply lyric cache reliability fix

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-reliability-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch repeated-track lyric cache
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('bluetooth_overlay/app/src/main/java/com/teslalyrics/app/MultiLyricsFetcher.java')
          s=p.read_text(encoding='utf-8')
          if 'ConcurrentHashMap' not in s:
              s=s.replace('import java.util.concurrent.Callable;','import java.util.concurrent.Callable;\nimport java.util.concurrent.ConcurrentHashMap;',1)
          old='''    private final Set<String> done=Collections.synchronizedSet(new HashSet<>());\n    private final Set<String> loading=Collections.synchronizedSet(new HashSet<>());\n    private volatile String latestKey="",publishedKey="",publishedProvider="",publishedLrc="";'''
          new='''    private final Set<String> done=Collections.synchronizedSet(new HashSet<>());\n    private final Set<String> loading=Collections.synchronizedSet(new HashSet<>());\n    private final ConcurrentHashMap<String,CachedLyrics> cache=new ConcurrentHashMap<>();\n    private volatile String latestKey="",publishedKey="",publishedProvider="",publishedLrc="";'''
          if old in s:s=s.replace(old,new,1)
          marker='''    private static final class Candidate {\n        String provider,title,artist,lrc;\n        long durationMs;\n        double score;\n        Candidate(String p,String t,String a,long d,String l){provider=p;title=nz(t);artist=nz(a);durationMs=d;lrc=nz(l);}\n    }'''
          if 'private static final class CachedLyrics' not in s:
              s=s.replace(marker,marker+'''\n\n    private static final class CachedLyrics {\n        final String provider,lrc; final int score;\n        CachedLyrics(String p,String l,int s){provider=nz(p);lrc=nz(l);score=s;}\n    }''',1)
          old='''        // The NetEase session can publish title first and its exact song ID a moment later.\n        // If another provider already won, allow one exact-ID upgrade without changing the canonical key.\n        boolean neteaseUpgrade=source.contains("网易云")&&!mediaId.isEmpty()&&key.equals(publishedKey)&&!publishedProvider.contains("网易云");\n        if(done.contains(key)&&!neteaseUpgrade)return;\n        if(!loading.add(key))return;'''
          new='''        CachedLyrics cached=cache.get(key);\n        boolean neteaseUpgrade=source.contains("网易云")&&!mediaId.isEmpty()&&\n                ((cached!=null&&!cached.provider.contains("网易云"))||\n                 (key.equals(publishedKey)&&!publishedProvider.contains("网易云")));\n        if(cached!=null){\n            publishedKey=key;publishedProvider=cached.provider;publishedLrc=cached.lrc;publishedScore=cached.score;\n            AppState.get().log.add("Lyrics cache hit: "+cached.provider+" score="+cached.score);\n            PublicStateRelay.get().publishLyrics(key,cached.provider,cached.lrc,cached.score);\n            if(!neteaseUpgrade)return;\n        }\n        if(done.contains(key)&&!neteaseUpgrade)return;\n        if(!loading.add(key))return;'''
          if old not in s:raise SystemExit('ensure marker missing')
          s=s.replace(old,new,1)
          old='''    public void republishLatest(){\n        String key=publishedKey,lrc=publishedLrc,provider=publishedProvider;\n        int score=publishedScore;\n        if(!key.isEmpty()&&key.equals(latestKey)&&validLrc(lrc))PublicStateRelay.get().publishLyrics(key,provider,lrc,score);\n    }'''
          new='''    public void republishLatest(){\n        String key=publishedKey,lrc=publishedLrc,provider=publishedProvider;\n        int score=publishedScore;\n        if(!key.isEmpty()&&key.equals(latestKey)&&validLrc(lrc)){\n            PublicStateRelay.get().publishLyrics(key,provider,lrc,score);return;\n        }\n        CachedLyrics cached=cache.get(latestKey);\n        if(cached!=null&&validLrc(cached.lrc)){\n            publishedKey=latestKey;publishedProvider=cached.provider;publishedLrc=cached.lrc;publishedScore=cached.score;\n            PublicStateRelay.get().publishLyrics(latestKey,cached.provider,cached.lrc,cached.score);\n        }\n    }'''
          if old not in s:raise SystemExit('republish marker missing')
          s=s.replace(old,new,1)
          old='''                rememberDone(key);\n                publishedKey=key;publishedProvider=best.provider;publishedLrc=best.lrc;publishedScore=(int)Math.round(best.score);\n                AppState.get().log.add("Lyrics matched: "+best.provider+" score="+publishedScore);'''
          new='''                rememberDone(key);\n                publishedKey=key;publishedProvider=best.provider;publishedLrc=best.lrc;publishedScore=(int)Math.round(best.score);\n                cache.put(key,new CachedLyrics(publishedProvider,publishedLrc,publishedScore));\n                AppState.get().log.add("Lyrics matched: "+best.provider+" score="+publishedScore);'''
          if old not in s:raise SystemExit('store marker missing')
          s=s.replace(old,new,1)
          old='''            if(done.size()>MAX_DONE){Iterator<String> it=done.iterator();while(done.size()>MAX_DONE&&it.hasNext()){it.next();it.remove();}}'''
          new='''            if(done.size()>MAX_DONE){Iterator<String> it=done.iterator();while(done.size()>MAX_DONE&&it.hasNext()){String oldKey=it.next();it.remove();cache.remove(oldKey);}}'''
          if old in s:s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit lyric cache fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bluetooth_overlay/app/src/main/java/com/teslalyrics/app/MultiLyricsFetcher.java
          git commit -m 'Cache matched lyrics per track for reliable revisits'
          git push
