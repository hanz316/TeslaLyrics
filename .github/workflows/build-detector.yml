name: Build Tesla Lyrics Patch Prep APK

on:
  push:
    branches: [ main ]
    paths:
      - 'detector/NeteaseApkExporterActivity.java'
      - '.github/workflows/build-detector.yml'
  workflow_dispatch:

jobs:
  build-patch-prep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate standalone patch prep project
        shell: bash
        run: |
          mkdir -p patchprep_project/app/src/main/java/com/teslalyrics/detector
          cp detector/NeteaseApkExporterActivity.java patchprep_project/app/src/main/java/com/teslalyrics/detector/NeteaseApkExporterActivity.java

          cat > patchprep_project/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'TeslaLyricsPatchPrep'
          include ':app'
          EOF

          cat > patchprep_project/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > patchprep_project/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > patchprep_project/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.teslalyrics.detector'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.teslalyrics.detector'
                  minSdk 29
                  targetSdk 35
                  versionCode 20
                  versionName 'PATCHPREP1'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > patchprep_project/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <queries>
                  <package android:name="com.netease.cloudmusic" />
              </queries>
              <application
                  android:allowBackup="false"
                  android:label="Tesla Lyrics Patch Prep"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".NeteaseApkExporterActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android lint
        working-directory: patchprep_project
        run: gradle --no-daemon lintDebug

      - name: Build patch prep APK
        working-directory: patchprep_project
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp patchprep_project/app/build/outputs/apk/debug/app-debug.apk TeslaLyrics-PatchPrep.apk

      - name: Upload patch prep APK
        uses: actions/upload-artifact@v4
        with:
          name: TeslaLyrics-PatchPrep
          path: TeslaLyrics-PatchPrep.apk
          if-no-files-found: error
