name: Fetch APK signer tool

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/get-apk-signer-tool.yml'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download uber-apk-signer
        run: curl -L --fail --retry 3 -o uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
      - name: Verify SHA-256
        run: echo 'e1299fd6fcf4da527dd53735b56127e8ea922a321128123b9c32d619bba1d835  uber-apk-signer.jar' | sha256sum -c -
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: uber-apk-signer-tool
          path: uber-apk-signer.jar
          if-no-files-found: error
