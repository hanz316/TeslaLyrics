name: Build TeslaLyrics Bluetooth APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct verified source package
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib
          names = [f"source/chunk_{i:02d}.b64" for i in range(6)]
          prefix = ''.join(Path(n).read_text() for n in names) + Path('source/chunk_06a.b64').read_text()
          tail = Path('source/chunk_06b.b64').read_text()
          expected_tail_blob = '255376dc0a621c5cf54efeb8bc9ecae8edc9bbd8'
          expected_zip_sha256 = '2ccad658458907eabf9ba481d75743e0eeb44bcee247a628d043a633450cfb28'
          alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='
          fixed = None
          for pos in range(len(tail) + 1):
              for ch in alphabet:
                  candidate = tail[:pos] + ch + tail[pos:]
                  raw = candidate.encode()
                  blob_sha = hashlib.sha1(f'blob {len(raw)}\0'.encode() + raw).hexdigest()
                  if blob_sha == expected_tail_blob:
                      fixed = candidate
                      break
              if fixed is not None: break
          if fixed is None: raise SystemExit('Could not reconstruct source')
          data = base64.b64decode(prefix + fixed, validate=True)
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected_zip_sha256: raise SystemExit(f'ZIP checksum mismatch: {actual}')
          Path('TeslaLyrics-project.zip').write_bytes(data)
          PY
          unzip -q TeslaLyrics-project.zip -d project

      - name: Apply Bluetooth Direct + public relay overlay
        shell: bash
        run: cp -a bluetooth_overlay/app/. project/app/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp project/app/build/outputs/apk/debug/app-debug.apk TeslaLyrics-PublicRelay.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeslaLyrics-PublicRelay-apk
          path: TeslaLyrics-PublicRelay.apk
          if-no-files-found: error
