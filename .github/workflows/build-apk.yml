name: Build TeslaLyrics APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source package
        shell: bash
        run: |
          cat source/chunk_*.b64 | base64 --decode > TeslaLyrics-project.zip
          unzip -q TeslaLyrics-project.zip -d project

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        shell: bash
        run: cp project/app/build/outputs/apk/debug/app-debug.apk TeslaLyrics.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeslaLyrics-apk
          path: TeslaLyrics.apk
          if-no-files-found: error
